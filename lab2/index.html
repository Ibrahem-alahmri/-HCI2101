<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الذاكرة الحديثة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #fd79a8;
            --bg: #f0f2f5;
            --card-back: #2d3436;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* شاشة البداية */
        #setup-screen, #game-screen {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 { color: var(--primary); margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--primary); }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover { background: #5b4bc4; transform: translateY(-2px); }

        /* منطقة اللعبة */
        #game-screen { display: none; max-width: 600px; }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background: #eee;
            border-radius: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            perspective: 1000px;
        }

        .card {
            height: 80px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card-back { background: var(--card-back); color: white; }
        .card-front {
            background: var(--accent);
            color: white;
            transform: rotateY(180deg);
        }

        /* التذييل الإجباري */
        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            width: 100%;
            border-top: 2px solid #ddd;
            background: #fff;
            color: #333;
            line-height: 1.6;
        }

        .highlight { color: var(--primary); font-weight: bold; }

        @media (max-width: 400px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            .card { height: 70px; }
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>لعبة مطابقة الذاكرة</h1>
        <div class="input-group">
            <label>اسم اللاعب الأول:</label>
            <input type="text" id="p1-name" placeholder="أدخل الاسم">
        </div>
        <div id="p2-input" class="input-group" style="display: none;">
            <label>اسم اللاعب الثاني:</label>
            <input type="text" id="p2-name" placeholder="أدخل الاسم">
        </div>
        <button class="btn" onclick="togglePlayers()" id="mode-btn">تبديل إلى لاعبين</button>
        <button class="btn" onclick="startGame()" style="background: #27ae60;">ابدأ اللعبة</button>
    </div>

    <div id="game-screen">
        <div class="stats">
            <div id="turn-info">اللاعب: <span id="current-player" class="highlight">-</span></div>
            <div>النقاط: <span id="score-display" class="highlight">0</span></div>
        </div>
        <div class="grid" id="game-grid"></div>
        <button class="btn" onclick="location.reload()" style="margin-top: 20px; background: #95a5a6;">العودة للقائمة</button>
    </div>

    <footer>
        <p>اسم الطالب: <span class="highlight">IBRAHIM WAJDI I ALAHMRY (ابراهيم وجدى بن ابراهيم الاحمرى)</span></p>
        <p>الرقم الجامعي: <span class="highlight">446001691</span></p>
        <p>بإشراف الدكتور: <span class="highlight">Mohammed Ahmed Jabali</span></p>
    </footer>

    <script>
        const symbols = ['⭐', '🍎', '🚀', '🎨', '⚽', '💎', '🌙', '🍀'];
        let cards = [...symbols, ...symbols];
        let flippedCards = [];
        let matchedCount = 0;
        let isTwoPlayer = false;
        let currentPlayer = 1;
        let scores = { p1: 0, p2: 0 };
        let names = { p1: '', p2: '' };
        let lockBoard = false;

        function togglePlayers() {
            isTwoPlayer = !isTwoPlayer;
            document.getElementById('p2-input').style.display = isTwoPlayer ? 'block' : 'none';
            document.getElementById('mode-btn').innerText = isTwoPlayer ? 'تبديل إلى لاعب واحد' : 'تبديل إلى لاعبين';
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startGame() {
            names.p1 = document.getElementById('p1-name').value || 'لاعب 1';
            names.p2 = document.getElementById('p2-name').value || 'لاعب 2';
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            setupGrid();
            updateUI();
        }

        function setupGrid() {
            const grid = document.getElementById('game-grid');
            shuffle(cards).forEach((symbol, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.symbol = symbol;
                card.innerHTML = `
                    <div class="card-back">؟</div>
                    <div class="card-front">${symbol}</div>
                `;
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (lockBoard || card.classList.contains('flipped') || flippedCards.includes(card)) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.symbol === card2.dataset.symbol;

            if (isMatch) {
                if (isTwoPlayer) {
                    currentPlayer === 1 ? scores.p1++ : scores.p2++;
                } else {
                    scores.p1++;
                }
                matchedCount += 2;
                resetTurn(true);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    if (isTwoPlayer) currentPlayer = currentPlayer === 1 ? 2 : 1;
                    resetTurn(false);
                }, 1000);
            }
        }

        function resetTurn(isMatch) {
            flippedCards = [];
            lockBoard = false;
            updateUI();
            if (matchedCount === cards.length) {
                alert(`انتهت اللعبة! \n النتيجة: ${names.p1}: ${scores.p1} ${isTwoPlayer ? '| ' + names.p2 + ': ' + scores.p2 : ''}`);
            }
        }

        function updateUI() {
            document.getElementById('current-player').innerText = isTwoPlayer ? (currentPlayer === 1 ? names.p1 : names.p2) : names.p1;
            document.getElementById('score-display').innerText = isTwoPlayer ? (currentPlayer === 1 ? scores.p1 : scores.p2) : scores.p1;
        }
    </script>
</body>
</html>
